# =============================================================================
# LogSherlock frontend — static bundle, and one reverse proxy in front of the API
# =============================================================================
# This file is what makes `VITE_API_BASE_URL` unset the right default in a
# container. The client then requests the relative path `/api/...`, nginx
# forwards it to the backend service, and every request is same-origin — so no
# CORS preflight is involved at all, and the browser never needs to know which
# port the API is published on.
# =============================================================================

upstream logsherlock_api {
    # The Compose service name. Resolved by Docker's embedded DNS on the shared
    # network, so it follows the container across a restart and a new address.
    server backend:8010;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 16 MB is the editor's own upload ceiling (`InvestigationForm`), and a
    # JSON-lines corpus escapes to about 1.14x that on the wire. nginx defaults
    # to 1 MB, which would reject every payload the UI is built to accept with a
    # 413 the client has no way to explain.
    client_max_body_size 32m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://logsherlock_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # `POST /api/investigate` runs the whole pipeline — eight nodes, up to
        # four LLM calls, an optional web search — against a payload of the
        # caller's choosing. The backend's own deadline is `API_GRAPH_TIMEOUT`
        # (900s), so these are set above it: a proxy that gave up first would
        # fail the request in the browser while an analysis that goes on to
        # store perfectly well was still running. Same reasoning, and the same
        # 15 minutes, as the Vite dev proxy in `vite.config.ts`.
        proxy_connect_timeout 60s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;

        # The report is one large JSON document; buffering it to disk before
        # answering adds latency for nothing.
        proxy_buffering off;
    }

    # The SPA fallback. There is one HTML entry point, and any other path is a
    # client-side route — so a reload on one must serve `index.html` rather than
    # a 404 from the filesystem.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable by construction: Vite renames them on every
    # content change, so a year-long cache can never serve a stale one.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # `index.html` is the one file that must never be cached: it is what names
    # the current asset hashes, and a cached copy pins a browser to a bundle
    # that no longer exists.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
